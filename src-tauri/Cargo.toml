[package]
name = "zxz"
version = "0.3.0"
description = "zxz - 轻量级 AI 对话外壳（Tauri 2 / Rust edition 2021）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zxz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心；devtools 便于调试期使用右键检查元素
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
futures-util = "0.3"
# 关闭默认特性以避免 native-tls/OpenSSL，改用 rustls，Windows/Linux 均免装 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[features]
# 生产构建（frontendDist 走本地资源）需要此特性，勿删
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
