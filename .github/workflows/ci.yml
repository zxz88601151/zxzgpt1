name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust-fs:
    # 只跑不依赖 tauri 的文件层单测：src-tauri 本体需要 WebView2 系统库，
    # 在 CI 里不做全量桌面构建，避免把环境问题误报成代码问题。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tools/fs-harness/Cargo.toml
